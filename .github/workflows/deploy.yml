name: Deploy para Hostinger

on:
  push:
    branches:
      - main

jobs:
  # só publica se o sistema de ingressos passar em todos os testes
  testes:
    uses: ./.github/workflows/testes.yml

  deploy:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fazer deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/node_modules/**
            **/data/shalom.db
            **/data/*.db
            **/data/*.db-wal
            **/data/*.db-shm
            **/data/certs/**
            **/tests/**
            **/package.json
            **/package-lock.json
            **/dev-server.py
            **/screenshots/**
            **/uploads/**
            **/.vscode/**
            **/.idea/**
            **/README.md
            **/LEIA-ME-ADMIN.md
